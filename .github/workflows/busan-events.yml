name: 부산 행사 업데이트

on:
  schedule:
    - cron: '0 21 * * 6'   # 매주 일요일 06:00 (한국시간)
  workflow_dispatch:         # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 연결 테스트
        continue-on-error: true
        run: |
          U="apis.data.go.kr/B553457/cultureinfo/area2?serviceKey=${{ secrets.BUSAN_API_KEY }}&PageNo=1&numOfrows=1&sido=%EB%B6%80%EC%82%B0"
          curl -sS -o /dev/null -w "https → HTTP %{http_code}\n" --max-time 30 "https://$U" || echo "https 연결 실패"
          curl -sS -o /dev/null -w "http  → HTTP %{http_code}\n" --max-time 30 "http://$U" || echo "http 연결 실패"
      - name: 부산 공공데이터 수집
        run: node scripts/fetch-busan-events.mjs
        env:
          BUSAN_API_KEY: ${{ secrets.BUSAN_API_KEY }}
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/busan-events.json
          git diff --cached --quiet || git commit -m "부산 행사 데이터 갱신 $(date -u +%F)"
          git push
